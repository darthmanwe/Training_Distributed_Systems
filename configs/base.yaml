seed: 42
run_id: null  # auto-generated if null

env:
  name: "scheduling"  # "scheduling" or "cartpole"
  num_env_workers: 5
  num_jobs: 20
  max_queue_len: 10
  max_steps_per_episode: 200

coordinator:
  heartbeat_timeout_s: 15.0
  heartbeat_interval_s: 5.0
  persist_state: true

workers:
  num_workers: 4
  rollout_steps: 256
  default_speed_factor: 1.0
  default_failure_rate: 0.0
  default_max_batch: 512
  heterogeneous: true
  profiles:
    - speed_factor: 1.0
      failure_rate: 0.0
      max_batch: 512
    - speed_factor: 0.7
      failure_rate: 0.02
      max_batch: 256
    - speed_factor: 0.4
      failure_rate: 0.05
      max_batch: 128
    - speed_factor: 0.3
      failure_rate: 0.08
      max_batch: 128

trainer:
  algorithm: "ppo"
  total_timesteps: 100000
  batch_size: 1024
  num_epochs: 4
  num_minibatches: 4
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  target_kl: null
  normalize_obs: true
  normalize_reward: true
  eval_interval: 10
  eval_episodes: 5
  checkpoint_interval: 10
  checkpoint_keep: 3

churn:
  enabled: false
  kill_interval_s: 60
  kill_probability: 0.0

perf:
  compile: false
  mixed_precision: false
  centralized_inference: false
  profile: false
  profile_steps: 5

obs:
  tracker: "local"  # "local", "wandb", "mlflow"
  prometheus_port: 8000
  log_level: "INFO"
