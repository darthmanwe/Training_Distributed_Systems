seed: 42

env:
  name: "cartpole"

workers:
  num_workers: 2
  rollout_steps: 128
  heterogeneous: false
  profiles:
    - speed_factor: 1.0
      failure_rate: 0.0
      max_batch: 512
    - speed_factor: 1.0
      failure_rate: 0.0
      max_batch: 512

trainer:
  algorithm: "ppo"
  total_timesteps: 50000
  batch_size: 256
  num_epochs: 4
  num_minibatches: 4
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  normalize_obs: false
  normalize_reward: false
  eval_interval: 5
  eval_episodes: 10
  checkpoint_interval: 20

churn:
  enabled: false
