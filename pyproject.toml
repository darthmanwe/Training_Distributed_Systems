[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dist-rl-platform"
version = "0.1.0"
description = "Fault-tolerant distributed RL training with heterogeneous workers, checkpoint recovery, and observability"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Kutlu Mizrak" }]
dependencies = [
    "torch>=2.2",
    "ray[default]>=2.9,<3.0",
    "gymnasium>=0.29",
    "structlog>=24.1",
    "omegaconf>=2.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.26",
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "opentelemetry-exporter-prometheus>=0.43b0",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
report = ["matplotlib>=3.8"]
all = ["wandb>=0.16", "mlflow>=2.10", "matplotlib>=3.8"]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "pre-commit>=3.6",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: full pipeline integration tests (deselect with '-m \"not integration\"')",
    "slow: tests that take >10s",
]
asyncio_mode = "auto"
timeout = 120
